# Workmate Live Portal Configuration
# Copy this file to portal.yaml and adjust as needed.
# portal.yaml is gitignored because it holds secrets.

server:
    address: 0.0.0.0
    port: 8080
    timeouts:
        read: 10s
        write: 10s
        shutdown: 5s

auth:
    jwt_secret: change-me-in-production
    token_duration: 24h0m0s
    default_user:
        username: admin
        password: changeme

agent:
    # HTTP polling of a directly reachable agent.
    # Leave empty when agents connect through the link instead (see api_key) —
    # an agent behind NAT cannot be polled.
    url: http://127.0.0.1:8787
    polling_interval: 3s
    timeout: 5s

    # Shared key for the agent link at /ws/agent. Empty disables the endpoint.
    # Must match portal.api_key in each agent's configuration.
    api_key: ""

    # Which agent controls OBS. Empty means: the first connected agent that
    # reports a local OBS instance.
    primary_id: ""

    # How long to wait for an agent to answer an OBS command.
    command_timeout: 10s

obs:
    # direct: the portal connects to the OBS WebSocket itself. Host and port
    #         below must be reachable from the portal.
    # agent:  OBS is controlled through an agent that dials into the portal.
    #         The streaming machine needs no inbound port; host, port and
    #         password below are then unused — configure OBS in the agent's
    #         own config instead. Requires agent.api_key.
    mode: direct

    host: localhost
    port: 4455
    password: ""
    auto_reconnect: true
    reconnect_delay: 5s

twitch:
    enabled: false
    client_id: ""
    client_secret: ""
    channel: ""
    oauth_token: ""
    commands_file: config/commands.yaml

youtube:
    enabled: false
    api_key: ""
    channel_id: ""
    client_id: ""
    client_secret: ""

automation:
    rules_file: config/rules.yaml

storage:
    type: sqlite
    path: ./portal.db

logging:
    level: info
    format: text
