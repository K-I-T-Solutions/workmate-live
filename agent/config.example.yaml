# Workmate Live Agent Configuration
# Copy this file to config.yaml and adjust as needed.
#
# The agent runs on Linux, Windows and macOS. The configuration is identical
# on all three; only where the file is looked up differs:
#
#   all           ./config.yaml
#   Linux         ~/.config/workmate-agent/config.yaml
#                 /etc/workmate-agent/config.yaml
#   macOS         ~/Library/Application Support/workmate-agent/config.yaml
#                 ~/.config/workmate-agent/config.yaml
#                 /etc/workmate-agent/config.yaml
#   Windows       %AppData%\workmate-agent\config.yaml
#                 %USERPROFILE%\.config\workmate-agent\config.yaml
#
# Or pass it explicitly:  workmate-live-agent --config <path>

# Server configuration
server:
  # Address to bind the API server
  address: "127.0.0.1"

  # Port for the API server
  port: 8787

  # HTTP server timeouts
  timeouts:
    # Maximum time to read request
    read: 5s

    # Maximum time to write response
    write: 5s

    # Grace period for shutdown
    shutdown: 5s

# Health monitoring configuration
health:
  # How often to poll system status
  polling_interval: 2s

  # Enable/disable individual system checks.
  # Disabled checks will return empty/zero values.
  # Each check uses whatever the platform provides:
  #
  #             Linux                Windows              macOS
  #   gpu       /dev/dri, sysfs      registry             system_profiler
  #   audio     PipeWire socket      WASAPI endpoints     coreaudiod
  #   video     /dev/video*          registry             system_profiler
  #   obs       /proc                process list         pgrep
  #
  # On macOS the gpu and video checks shell out to system_profiler, which
  # takes about a second. Their result is therefore read once at startup —
  # a camera plugged in later shows up after a restart of the agent.
  checks:
    gpu: true
    audio: true
    video: true
    obs: true

# OBS remote control
# Enable this on the machine where OBS runs. The agent connects to the local
# OBS WebSocket and executes the commands the portal sends over the link, so
# the OBS WebSocket port never has to be exposed to the network.
obs:
  # Enable OBS control
  enabled: false

  # Local OBS WebSocket address. Keep this on the loopback interface —
  # the portal reaches OBS through the agent, not directly.
  host: "127.0.0.1"
  port: 4455

  # Password from OBS: Tools -> WebSocket Server Settings
  password: ""

  # Wait time before retrying after a lost OBS connection
  reconnect_delay: 5s

# Portal link
# The agent opens an outgoing WebSocket to the portal and keeps it open.
# Because the agent dials out, this works from behind NAT or a firewall
# without any inbound port on this machine.
portal:
  # Enable the portal link
  enabled: false

  # Portal base URL. http:// and https:// are upgraded to ws:// and wss://
  # automatically; the agent appends /ws/agent itself.
  url: "https://portal.workmate.live"

  # Shared key — must match agent.api_key in the portal configuration
  api_key: ""

  # Identifies this agent to the portal. Empty means: use the hostname.
  # Must match the portal's agent.primary_id if one is configured.
  agent_id: ""

  # Reserved for a future login flow; api_key is what the link uses today.
  credentials:
    username: ""
    password: ""

  # Handshake timeout for the connection attempt
  timeout: 10s

  # Reconnect pacing: the delay doubles per failed attempt, up to
  # retry_attempts doublings, then stays constant (capped at 2 minutes).
  retry_attempts: 3
  retry_delay: 5s
